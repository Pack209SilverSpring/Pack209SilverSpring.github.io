name: Build & Deploy Jekyll to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Rebuild twice a day to pick up new Google Calendar events.
    # Cron is in UTC: 11:17 and 23:17 UTC = about 6:17am and 6:17pm Eastern
    # (an hour later during daylight saving time).
    - cron: '17 11,23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung build holds the "pages" lock and blocks every run behind it
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Figure out where Jekyll's "source" directory is (defaults to ".")
      - name: Determine Jekyll source dir
        id: jsrc
        run: |
          SRC=$(ruby -ryaml -e 'c=YAML.load_file("_config.yml"); puts(c["source"] || ".")')
          echo "JEKYLL_SRC=$SRC" >> "$GITHUB_ENV"

      # Write the calendar key into the Jekyll source directory
      - name: Write gcalendar-key.json
        shell: bash
        run: |
          mkdir -p "$JEKYLL_SRC"
          # preserve newlines/quotes exactly
          cat > "$JEKYLL_SRC/gcalendar-key.json" <<'JSON'
          ${{ secrets.GCALENDAR_KEY_JSON }}
          JSON

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: '3.4'

      - name: Build site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Optimize built images
        run: bash script/optimize-images.sh _site/assets/images

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
