# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Pack 209
email: webmaster@cubscoutpack209.org
cubmaster_email: cubmaster@cubscoutpack209.org
description: >- # this means to ignore newlines until "baseurl:"
  Cub Scout Pack 209 of Silver Spring, Maryland. We provide fun, character-building adventures
  for K-5th grade youth through outdoor activities, STEM projects, and community service.
  Join us for camping, Pinewood Derby races, and much more!
baseurl: "" # the subpath of your site, e.g. /blog -- empty, root domain
url: "https://cubscoutpack209.org" # custom domain (see CNAME file); GitHub Pages default was pack209silverspring.github.io
twitter_username: jekyllrb
github_username:  jekyll

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-tailwindcss
  - jekyll-google-calendar

# Generic CMS-created pages ("Other Pages" in the admin). Each file in
# _generic_pages/ becomes its own static page at /<filename>/, built the
# same as any hand-coded page -- the layout and front matter defaults
# below are what make that automatic, so a new page created from the CMS
# doesn't need to set them itself.
collections:
  generic_pages:
    output: true
    permalink: /:slug/

# hideTitle/hero_header aren't set here: whether a given generic page shows
# the plain title block or the transparent floating hero header now depends
# on whether that page has a hero_image, computed in _layouts/default.html
# (see `has_hero`) -- a blanket default here would force every generic page
# into hero styling even when it has no hero photo to show.
defaults:
  - scope:
      path: ""
      type: "generic_pages"
    values:
      layout: "generic-page"

# Google Calendar config. The GCALENDAR_KEY_JSON GitHub Actions secret is
# written out to gcalendar-key.json at build time (see .github/workflows/pages.yml).
gcalendar:
  key_file: ./gcalendar-key.json
  calendars:
    - name: 🐾 Pack 209
      id: cubscoutpack209.org_t8ogqcp85ek4enb4qm6ociaicg@group.calendar.google.com
      directory: events
      layout: event-public
      date_format: "%Y-%m-%d"
      look_ahead: 365


# Exclude from processing.
# Jekyll's built-in defaults exclude Gemfile, Gemfile.lock, node_modules,
# and vendor/. Anything listed here is added on top of those.
exclude:
  - gcalendar-key.json  # Google service account key — must NOT be published
  - CLAUDE.md           # Claude Code project instructions
  - README.md           # repo README
  - LICENSE
  - mise.toml
  - script/             # build/deploy helper scripts
  - docs/               # internal design specs and planning docs
  - .claude/
  - .github/
  - .ruby-lsp/
  - .ruby-version
  - .sass-cache/
  - .jekyll-cache/
