{% comment %}
Leader card partial - a reusable component for displaying a single leader
Parameters:
- leader: Leader object from site.data.leaders
{% endcomment %}

<div class="flex items-center gap-4 py-2">
  <img src="{{ include.leader.image }}" alt="{{ include.leader.name }}, {{ include.leader.role }}" class="object-cover flex-shrink-0 w-14 h-14 rounded-full ring-{{ include.leader.ring_color }} ring-2" loading="lazy" decoding="async">
  <div>
    <p class="font-semibold">{{ include.leader.name }}</p>
    <p class="text-sm text-slate-600">{{ include.leader.role }}</p>
  </div>
</div>
