# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Pack 209
email: webmaster@cubscoutpack209.org
cubmaster_email: cubmaster@cubscoutpack209.org
description: >- # this means to ignore newlines until "baseurl:"
  Cub Scout Pack 209 of Silver Spring, Maryland. We provide fun, character-building adventures
  for K-5th grade youth through outdoor activities, STEM projects, and community service.
  Join us for camping, Pinewood Derby races, and much more!
baseurl: "" # the subpath of your site, e.g. /blog -- empty because we're using an org root site (Pack209SilverSpring.github.io)
url: "https://pack209silverspring.github.io" # update if you switch repo names or add a custom domain later
twitter_username: jekyllrb
github_username:  jekyll

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-tailwindcss
  - jekyll-google-calendar

# Google Calendar config. The GCALENDAR_KEY_JSON GitHub Actions secret is
# written out to gcalendar-key.json at build time (see .github/workflows/pages.yml).
gcalendar:
  key_file: ./gcalendar-key.json
  calendars:
    - name: 🐾 Pack 209
      id: cubscoutpack209.org_t8ogqcp85ek4enb4qm6ociaicg@group.calendar.google.com
      directory: events
      layout: event-public
      date_format: "%Y-%m-%d"
      look_ahead: 365
